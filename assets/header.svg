<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="G Sai Karthikeya — AI/ML engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="c1"><rect x="200" y="58" height="32" width="0"><animate attributeName="width" from="0" to="110" begin="0.4s" dur="0.9s" fill="freeze" calcMode="discrete" keyTimes="0;0.15;0.3;0.45;0.6;0.75;0.9;1" values="0;14;30;46;62;78;94;110"/></rect></clipPath>
    <clipPath id="c2"><rect x="200" y="183" height="32" width="0"><animate attributeName="width" from="0" to="180" begin="2.5s" dur="0.9s" fill="freeze" calcMode="discrete" keyTimes="0;0.15;0.3;0.45;0.6;0.75;0.9;1" values="0;24;50;76;102;128;154;180"/></rect></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .fade1{opacity:0;animation:in .6s ease-out 1.4s forwards}
      .fade2{opacity:0;animation:in .6s ease-out 1.8s forwards}
      .fade3{opacity:0;animation:in .6s ease-out 3.5s forwards}
      .cursor{animation:blink 1s steps(1) 3.6s infinite;opacity:0}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes blink{0%{opacity:1}50%{opacity:0}}
      .node{fill:#0b1020;stroke:#7cc4ff;stroke-width:2}
      .edge{stroke:#7cc4ff;stroke-opacity:.16;stroke-width:1.2}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{fill-opacity:.15}50%{fill-opacity:.9}}
    </style>
  </defs>

  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="18" fill="url(#grid)"/>

  <!-- window chrome -->
  <circle cx="34" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="28" r="6" fill="#febc2e"/>
  <circle cx="74" cy="28" r="6" fill="#28c840"/>
  <text x="96" y="33" class="mono" font-size="13" fill="#6b7a99">karthik@srm-ap: ~</text>

  <!-- line 1: whoami -->
  <text x="56" y="80" class="mono" font-size="20"><tspan fill="#28c840">❯</tspan><tspan fill="#6b7a99"> ~/karthik</tspan></text>
  <g clip-path="url(#c1)">
    <text x="56" y="80" class="mono" font-size="20" fill="#e6edf3" dx="150">whoami</text>
  </g>
  <text x="56" y="128" class="sans fade1" font-size="44" font-weight="800" fill="url(#name)" letter-spacing="0.5">G Sai Karthikeya</text>
  <text x="56" y="160" class="mono fade2" font-size="17" fill="#9fb0d0">AI/ML Engineer · B.Tech CSE (AI/ML) '27 · SRM University AP</text>

  <!-- line 2: focus -->
  <text x="56" y="205" class="mono" font-size="20"><tspan fill="#28c840">❯</tspan><tspan fill="#6b7a99"> ~/karthik</tspan></text>
  <g clip-path="url(#c2)">
    <text x="56" y="205" class="mono" font-size="20" fill="#e6edf3" dx="150">cat focus.txt</text>
  </g>
  <g class="fade3">
    <text x="56" y="240" class="mono" font-size="17" fill="#e6edf3">
      <tspan fill="#7cc4ff">deep-learning</tspan><tspan fill="#6b7a99">  ·  </tspan><tspan fill="#a78bfa">nlp</tspan><tspan fill="#6b7a99">  ·  </tspan><tspan fill="#f472b6">rag</tspan><tspan fill="#6b7a99">  ·  </tspan><tspan fill="#fbbf24">medical-imaging</tspan>
    </text>
    <text x="56" y="278" class="mono" font-size="20"><tspan fill="#28c840">❯</tspan><tspan fill="#6b7a99"> ~/karthik</tspan></text>
  </g>
  <rect x="206" y="262" width="11" height="21" fill="#e6edf3" class="cursor"/>

  <!-- neural net -->
  <g transform="translate(830,45)">
    <!-- edges: layer 0 -> 1 -->
    <g class="edge">
      <line x1="0" y1="60"  x2="110" y2="20"/><line x1="0" y1="60"  x2="110" y2="90"/><line x1="0" y1="60"  x2="110" y2="160"/><line x1="0" y1="60"  x2="110" y2="230"/>
      <line x1="0" y1="125" x2="110" y2="20"/><line x1="0" y1="125" x2="110" y2="90"/><line x1="0" y1="125" x2="110" y2="160"/><line x1="0" y1="125" x2="110" y2="230"/>
      <line x1="0" y1="190" x2="110" y2="20"/><line x1="0" y1="190" x2="110" y2="90"/><line x1="0" y1="190" x2="110" y2="160"/><line x1="0" y1="190" x2="110" y2="230"/>
      <line x1="110" y1="20"  x2="220" y2="60"/><line x1="110" y1="20"  x2="220" y2="125"/><line x1="110" y1="20"  x2="220" y2="190"/>
      <line x1="110" y1="90"  x2="220" y2="60"/><line x1="110" y1="90"  x2="220" y2="125"/><line x1="110" y1="90"  x2="220" y2="190"/>
      <line x1="110" y1="160" x2="220" y2="60"/><line x1="110" y1="160" x2="220" y2="125"/><line x1="110" y1="160" x2="220" y2="190"/>
      <line x1="110" y1="230" x2="220" y2="60"/><line x1="110" y1="230" x2="220" y2="125"/><line x1="110" y1="230" x2="220" y2="190"/>
      <line x1="220" y1="60"  x2="310" y2="125"/><line x1="220" y1="125" x2="310" y2="125"/><line x1="220" y1="190" x2="310" y2="125"/>
    </g>

    <!-- travelling signals -->
    <g fill="#7cc4ff">
      <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M0,60 L110,90 L220,125 L310,125"/></circle>
      <circle r="4" fill="#a78bfa"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" path="M0,190 L110,160 L220,60 L310,125"/></circle>
      <circle r="4" fill="#f472b6"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite" path="M0,125 L110,20 L220,190 L310,125"/></circle>
    </g>

    <!-- nodes -->
    <g>
      <circle class="node" cx="0" cy="60" r="11"/><circle class="node" cx="0" cy="125" r="11"/><circle class="node" cx="0" cy="190" r="11"/>
      <circle class="node" cx="110" cy="20" r="11"/><circle class="node" cx="110" cy="90" r="11"/><circle class="node" cx="110" cy="160" r="11"/><circle class="node" cx="110" cy="230" r="11"/>
      <circle class="node" cx="220" cy="60" r="11"/><circle class="node" cx="220" cy="125" r="11"/><circle class="node" cx="220" cy="190" r="11"/>
    </g>
    <g fill="#7cc4ff">
      <circle class="pulse" cx="110" cy="90" r="6"/>
      <circle class="pulse" cx="220" cy="125" r="6" style="animation-delay:.8s"/>
      <circle class="pulse" cx="110" cy="230" r="6" style="animation-delay:1.6s"/>
    </g>
    <!-- output -->
    <circle cx="310" cy="125" r="34" fill="url(#glow)" class="pulse"/>
    <circle cx="310" cy="125" r="15" fill="#0b1020" stroke="#f472b6" stroke-width="2.5"/>
    <text x="310" y="172" text-anchor="middle" class="mono" font-size="12" fill="#6b7a99">P(hire) ↑</text>
  </g>
</svg>
